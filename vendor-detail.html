<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookedJA — Experience</title>
  <meta name="description" content="Experience details, plain-words verification, itinerary, fixed pricing and booking for a BookedJA host." />
  <meta name="theme-color" content="#0E5435" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/images/bookedja-icon.png" />
  <link rel="apple-touch-icon" href="./assets/images/bookedja-icon.png" />
  <link rel="stylesheet" href="./assets/fonts.css" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <script defer src="./assets/data/vendors.js"></script>
  <script defer src="./assets/app.js"></script>
  <style>
    .detail-hero { border-radius: var(--radius); overflow: clip; aspect-ratio: 16/8; background: var(--green-tint); }
    .detail-hero img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3; } }
    .detail-grid { display: grid; gap: 2rem; }
    @media (min-width: 901px) { .detail-grid { grid-template-columns: 1.6fr 1fr; align-items: start; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#root">Skip to main content</a>

  <header class="site-header">
    <div class="container site-header__in">
      <a href="./index.html" class="brand-lockup" aria-label="BookedJA home">
        <img src="./assets/images/bookedja-mark-dark.png" alt="" aria-hidden="true" class="brand-lockup__mark" /><img src="./assets/images/bookedja-wordmark-dark.png" alt="BookedJA" class="brand-lockup__wordmark" />
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Main">
        <a href="./experiences.html">Things to do</a>
        <a href="./my-bookings.html">My bookings</a>
        <a href="./vendors.html">For operators</a>
        <a href="./about.html">About</a>
      </nav>
      <a href="./experiences.html" class="btn btn--ghost btn--small header-cta">← All experiences</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav" aria-label="Open menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main id="root" tabindex="-1" class="container section--tight">
    <p class="muted center" style="padding:4rem 0">Loading…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__bar">
        <span>© 2026 BookedJA · Made in St. Elizabeth, Jamaica</span>
        <span>Prototype — no real payments are processed</span>
      </div>
    </div>
  </footer>

<script>
  let guests = 2;

  function trustRow(label, done) {
    return `<li><span class="tick${done ? '' : ' tick--off'}">${done ? '✓' : '·'}</span> ${label}${done ? '' : ' <span class="faded small">(in progress)</span>'}</li>`;
  }

  function render(v) {
    const isTransport = v.category === 'Transport';
    const unit = isTransport ? 'per trip' : 'per person';
    const name = safeText(v.name);
    const title = safeText(v.title);
    const town = safeText(v.town);
    document.title = 'BookedJA — ' + cleanText(decodeHTML(v.title));

    const today = new Date();
    const minDate = new Date(today.getTime() + 86400e3).toISOString().slice(0, 10); // from tomorrow
    const defDate = new Date(today.getTime() + 3 * 86400e3).toISOString().slice(0, 10);

    const tierBadge = v.sample
      ? '<span class="badge" style="background:#e7ebe5;color:#49594f">◦ Sample listing</span>'
      : (v.tier === 'Top Local'
        ? '<span class="badge badge--top">★ Top Local</span>'
        : (v.tier === 'New' ? '<span class="badge badge--new">New host</span>' : '<span class="badge badge--verified">✓ Verified</span>'));

    document.getElementById('root').innerHTML = `
      <div class="detail-hero"><img src="${v.image}" alt="" /></div>

      <div class="detail-grid mt-4">
        <div class="stack--lg stack">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              ${tierBadge}
              <span class="muted small">${town} · ${v.durationHrs ? v.durationHrs + ' hours' : 'flexible timing'}</span>
            </div>
            <h1 class="mt-2" style="font-size:clamp(1.8rem,5vw,2.6rem)">${title}</h1>
            <p class="mt-2 muted" style="font-size:1.08rem">${safeText(v.short)}</p>
            <p class="mt-2 bold">${v.rating > 0 ? '★ ' + v.rating.toFixed(1) + ' · ' + v.trips + ' trips with guests' : 'Just joined BookedJA — be their first review'}</p>
          </div>

          <!-- Host + trust -->
          <div class="card card--tint">
            <h2 style="font-size:1.3rem">Your host: ${name}</h2>
            <p class="mt-2 muted">${safeText(v.about)}</p>
            ${v.sample ? `<p class="mt-3 small" style="background:#fff8e1;border:1px solid #e9b824;border-radius:.5rem;padding:.6rem .8rem;color:#5b4a12">
              <strong>Demonstration listing.</strong> This is not a real, checked operator. The verification badges below are shown to illustrate how a verified host appears — every live host is checked in person before going public.</p>` : ''}
            <ul class="trust-list mt-3">
              ${trustRow('ID checked in person', v.verification.identity)}
              ${trustRow('Tourism licence', v.verification.jtb)}
              ${trustRow('Insured', v.verification.insured)}
              ${trustRow('Visitor-ready (TPDCo standard)', v.verification.tpdco)}
              ${trustRow('First-aid trained', v.verification.firstAid)}
            </ul>
            <a id="askHost" href="#" target="_blank" rel="noopener" class="btn btn--wa mt-4">${waIcon()} Ask ${safeText(firstName(v.name))} a question</a>
          </div>

          <!-- Included / bring -->
          <div class="grid grid--2">
            <div class="card">
              <h3>What's included</h3>
              <ul class="trust-list mt-3">
                ${(v.included || []).map(i => `<li><span class="tick">✓</span> ${i}</li>`).join('') || '<li class="muted">Details coming soon.</li>'}
              </ul>
            </div>
            <div class="card">
              <h3>What to bring</h3>
              <ul class="trust-list mt-3">
                ${(v.bring || []).map(i => `<li><span class="tick" style="background:var(--gold);color:var(--ink)">•</span> ${i}</li>`).join('') || '<li class="muted">Just yourself.</li>'}
              </ul>
            </div>
          </div>

          <!-- Itinerary -->
          ${(v.itinerary && v.itinerary.length) ? `
          <div class="card">
            <h3>How the day goes</h3>
            <ul class="timeline mt-3">
              ${v.itinerary.map(s => `<li><span class="t">${safeText(s.time)}</span><span>${safeText(s.activity)}</span></li>`).join('')}
            </ul>
          </div>` : ''}

          <!-- Reviews -->
          <div>
            <h2 style="font-size:1.5rem">What guests say</h2>
            <div class="stack mt-3">
              ${(v.reviews && v.reviews.length) ? v.reviews.map(r => `
                <div class="card card--flat">
                  <p class="bold">${'★'.repeat(r.stars)} <span class="muted" style="font-weight:600">${safeText(r.name)}</span></p>
                  <p class="mt-1 muted">"${safeText(r.text)}"</p>
                </div>`).join('')
              : '<p class="muted">No reviews yet — this host just joined. Every review on BookedJA comes from a completed booking.</p>'}
            </div>
          </div>

          <!-- Cancellation -->
          <div class="notice notice--ok">
            <p class="bold">Change of plans? No stress.</p>
            <p class="mt-1 muted">${safeText(v.cancellation)}</p>
          </div>
        </div>

        <!-- BOOKING BOX -->
        <aside class="bookbox">
          <div class="card" style="border:2px solid var(--green)">
            <p class="xcard__price"><strong style="font-size:1.8rem">${fmtUSD(v.pricePerPersonUSD)}</strong><span>${unit} · ≈ ${fmtJMD(v.pricePerPersonUSD * USD_TO_JMD)}</span></p>

            <form id="bookForm" class="mt-3">
              <label class="field">
                <span>Which day?</span>
                <input id="bkDate" class="input" type="date" min="${minDate}" value="${defDate}" required />
              </label>
              <label class="field">
                <span>What time?</span>
                <select id="bkTime" class="input">
                  ${v.times.map(t => `<option value="${safeText(t)}">${safeText(t)}</option>`).join('')}
                </select>
              </label>
              <div class="field">
                <span id="guestsLabel">How many people?</span>
                <div class="stepper" role="group" aria-labelledby="guestsLabel">
                  <button type="button" id="gMinus" aria-label="One less person">−</button>
                  <output id="gOut">2</output>
                  <button type="button" id="gPlus" aria-label="One more person">+</button>
                </div>
              </div>

              <div class="summary-total mt-3">
                <span class="bold">Total</span>
                <span class="amt" id="totalOut"></span>
              </div>
              <p class="small faded center" id="totalJmd"></p>

              <button type="submit" class="btn btn--primary btn--big btn--block mt-3">Book now</button>
              <p class="small muted center mt-2">You don't pay yet — next step shows everything first.</p>
            </form>
          </div>

          <div class="card card--flat mt-3">
            <ul class="trust-list">
              <li><span class="tick">✓</span> Money held safely until it's done</li>
              <li><span class="tick">✓</span> Pass works without internet</li>
              <li><span class="tick">✓</span> Help on WhatsApp any day</li>
            </ul>
          </div>
        </aside>
      </div>
    `;

    // WhatsApp ask-the-host
    document.getElementById('askHost').href = waLink(vendorWhatsApp(v),
      'Hi ' + firstName(cleanText(decodeHTML(v.name))) + '! I found you on BookedJA and I have a question about "' + cleanText(decodeHTML(v.title)) + '".');

    // Guest stepper + totals
    const maxGuests = isTransport ? 7 : 10;
    function syncTotal() {
      document.getElementById('gOut').textContent = guests;
      const t = v.pricePerPersonUSD * (isTransport ? 1 : guests);
      document.getElementById('totalOut').textContent = fmtUSD(t);
      document.getElementById('totalJmd').textContent = '≈ ' + fmtJMD(t * USD_TO_JMD) + ' Jamaican';
      document.getElementById('gMinus').disabled = guests <= 1;
      document.getElementById('gPlus').disabled = guests >= maxGuests;
    }
    document.getElementById('gMinus').addEventListener('click', () => { guests = Math.max(1, guests - 1); syncTotal(); });
    document.getElementById('gPlus').addEventListener('click', () => { guests = Math.min(maxGuests, guests + 1); syncTotal(); });
    syncTotal();

    document.getElementById('bookForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('bkDate').value;
      if (!date) { showToast('Pick a day first'); return; }
      const time = document.getElementById('bkTime').value;
      location.href = './book.html?vendor=' + encodeURIComponent(v.id)
        + '&date=' + encodeURIComponent(date)
        + '&time=' + encodeURIComponent(time)
        + '&guests=' + guests;
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const v = getVendor(getQuery('id'));
    if (!v) {
      document.getElementById('root').innerHTML = `
        <div class="center" style="padding:4rem 0">
          <h1 style="font-size:1.8rem">We couldn't find that experience</h1>
          <a href="./experiences.html" class="btn btn--primary mt-4">See all things to do</a>
        </div>`;
      return;
    }
    render(v);
  });
</script>
</body>
</html>
